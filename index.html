<p>カレンダーを読み込んでいます…</p>
<script>
  // ▼▼▼ ここに GAS の「ウェブアプリのURL」（…/exec で終わるもの）を貼る ▼▼▼
  var GAS_URL = "https://script.google.com/macros/s/AKfycbyJwsvqiM7qKEWIDPVQFsFl5abP-jVpj-3s7aRHFHqUuy5kOWSp3XXh2uo9bxibHZUM/exec";
  // ▲▲▲ 変えるのはこの1行だけ ▲▲▲

  // 読み込めなかったときの予備（帯つきの元のページへ移動）
  var BACKUP = "https://claude.ai/artifact/EQ6cNortd7NJepcyrDUBFn";
  function fallback(){ location.replace(BACKUP); }

  var timer = setTimeout(fallback, 15000);
  fetch(GAS_URL, { cache: "no-store" })
    .then(function(r){ return r.text(); })
    .then(function(html){
      clearTimeout(timer);
      if (html.indexOf("<html") === -1) { fallback(); return; }
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(){ clearTimeout(timer); fallback(); });
</script>
